name: Checkout
description: |-

  Handles the checkout process for authenticated users.
endpoints:
  -
    httpMethods:
      - POST
    uri: api/checkout
    metadata:
      groupName: Checkout
      groupDescription: |-

        Handles the checkout process for authenticated users.
      subgroup: ''
      subgroupDescription: ''
      title: 'Perform checkout and create a new order.'
      description: "Converts the authenticated user's cart into a finalized order."
      authenticated: true
      custom: []
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      address:
        name: address
        description: 'The shipping address.'
        required: true
        example: '123 Main St, Cairo'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        custom: []
    cleanBodyParameters:
      address: '123 Main St, Cairo'
    fileParameters: []
    responses:
      -
        status: 201
        content: |-
          {
            "status": true,
            "message": "Checkout completed",
            "order_id": 5,
            "total": 2599.50,
            "items_count": 2
          }
        headers: []
        description: ''
        custom: []
      -
        status: 400
        content: |-
          {
            "status": false,
            "message": "Cart is empty"
          }
        headers: []
        description: ''
        custom: []
      -
        status: 422
        content: |-
          {
            "message": "The given data was invalid.",
            "errors": {
              "address": ["The address field is required."]
            }
          }
        headers: []
        description: ''
        custom: []
      -
        status: 500
        content: |-
          {
            "status": false,
            "error": "Product Laptop X does not have enough stock."
          }
        headers: []
        description: ''
        custom: []
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
    custom: []
